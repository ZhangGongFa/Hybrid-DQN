 keys.forEach((key,j)=>{const v=data[key][metric][i],x=center-total/2+j*(bw+gap),y=Math.min(zero,ys(v)),height=Math.max(1,Math.abs(ys(v)-zero));out+=`<rect x="${x}" y="${y}" width="${bw}" height="${height}" rx="2" fill="${colors[j]}"><title>${key==='Hybrid'?'Hybrid-DQN':key} · ${h} ngày: ${f(v,3)}</title></rect>`;if(j===0)out+=`<text x="${x+bw/2}" y="${y-7}" text-anchor="middle" style="fill:var(--blue);font-size:11px;font-weight:600">${f(v,3)}</text>`;});out+=`<text x="${center}" y="${H-4}" text-anchor="middle" style="fill:${S.horizon===h?'var(--blue)':'var(--muted)'}">${h} ngày</text></g>`;});return `<div class="chart">${out}</svg></div>`;
}

 <div class="table-wrap allocation-table"><table><thead><tr><th>Cổ phiếu / doanh nghiệp</th><th>Tỷ trọng mục tiêu</th><th>Vốn phân bổ</th><th>21 phiên</th><th>Tín hiệu</th><th></th></tr></thead><tbody>${p.rows.map((r,i)=>`<tr data-plan-row data-search="${r.ticker} ${r.name} ${E.SECTORS[r.sector]}" data-sector="${r.sector}"><td class="name"><div class="stock-name"><span class="stock-avatar" style="background:${E.COLORS[r.sector]}18;color:${E.COLORS[r.sector]}">${r.ticker.slice(0,2)}</span><div><button class="ticker-link" data-action="stock" data-value="${r.id}" data-key="${p.key}" data-date="${p.signalDate}">${r.ticker}</button><span>${r.name} · ${E.SECTORS[r.sector]}</span></div></div></td><td><b>${pct(r.weight,2)}</b><div class="weight-bar"><i style="width:${r.weight/p.cap*100}%"></i></div></td><td class="amount-cell">${amount(r.amount)}</td><td class="${r.r21>=0?'positive':'negative'}">${pct(r.r21,2,true)}</td><td class="name">${tag(r.trend,r.trend==='Tích cực'?'teal':'amber')}</td><td><button class="icon-btn" data-action="stock" data-value="${r.id}" data-key="${p.key}" data-date="${p.signalDate}" aria-label="Xem ${r.ticker}">${I('arrow')}</button></td></tr>`).join('')}</tbody><tfoot><tr><td>Tổng phân bổ cổ phiếu</td><td>100,00%</td><td>${amount(p.invested)}</td><td colspan="3"></td></tr></tfoot></table></div><p class="source">Số tiền là ngân sách phân bổ, chưa quy đổi thành khối lượng đặt lệnh. Thông tin dữ liệu và quy tắc tính tại <button class="text-link" data-action="help">Phương pháp & nguồn dữ liệu</button>.</p></section>
 <div class="equal-col section-gap"><section class="panel panel-pad">${panelTitle('Cơ cấu ngành','Tỷ trọng trong phần vốn cổ phiếu')}${planDonut(p)}</section><section class="panel panel-pad">${panelTitle('Kỷ luật phân bổ','Các điều kiện đã áp dụng')}<div class="summary-line"><span class="muted">Tập cổ phiếu</span><strong>${p.count} mã</strong></div><div class="summary-line"><span class="muted">Giới hạn / mã</span><strong>${pct(p.cap,0)}</strong></div><div class="summary-line"><span class="muted">Trọng số lớn nhất</span><strong>${pct(p.rows[0].weight,2)}</strong></div><div class="summary-line"><span class="muted">HHI</span><strong class="mono">${f(p.hhi,3)}</strong></div><div class="summary-line"><span class="muted">Chi phí trên vốn cổ phiếu</span><strong>0,10%</strong></div><div class="summary-explainer">D3QN trong kiến trúc nghiên cứu chọn chế độ. Tập tài sản được xếp hạng theo động lượng; PSO/HRP xác định trọng số. Mỗi mã trong bảng có ngân sách cụ thể và thông tin truy vết.</div></section></div></div></div>${foot()}`;
}
function planDonut(p){let off=0;return `<div class="donut-layout"><div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="Phân bổ ngành"><circle cx="70" cy="70" r="53" fill="none" stroke="var(--line)" stroke-width="17"/>${p.sectors.map((v,i)=>{const el=`<circle cx="70" cy="70" r="53" fill="none" stroke="${E.COLORS[i]}" stroke-width="17" stroke-dasharray="${v*333.009} 333.009" stroke-dashoffset="${-off*333.009}"/>`;off+=v;return v?el:'';}).join('')}</svg><div class="donut-center"><strong>${p.count}</strong><span>cổ phiếu</span></div></div><div class="donut-legend">${p.sectors.map((v,i)=>v?`<div class="sector-line"><i class="sector-dot" style="background:${E.COLORS[i]}"></i><span>${E.SECTORS[i]}</span><span>${pct(v)}</span></div>`:'').join('')}</div></div>`;}
function stockDetail(key,id,asof){
 const a=E.assetInfo(key,Number(id),asof),start=Math.max(0,a.prices.length-126),base=a.prices[start],curve=a.prices.slice(start).map(x=>x/base*100),p=V2.plan,position=p?.key===key?p.rows.find(r=>r.id===Number(id)):null;
 $('stockTitle').textContent=a.ticker+' · '+a.name;
 $('stockBody').innerHTML=`<div class="stock-detail-meta">${tag(key==='VN'?'Việt Nam':'Hoa Kỳ','blue')}${tag(E.SECTORS[a.sector])}<span class="muted">Đến ${date(a.date)}</span></div><div class="stock-kpis"><div><span>21 phiên</span><strong class="${a.r21>=0?'positive':'negative'}">${pct(a.r21,2,true)}</strong></div><div><span>63 phiên</span><strong class="${a.r63>=0?'positive':'negative'}">${pct(a.r63,2,true)}</strong></div><div><span>RSI (14)</span><strong>${f(a.rsi.at(-1)??50,1)}</strong></div><div><span>Biến động / năm</span><strong>${pct(a.vol)}</strong></div></div>${panelTitle('Chỉ số tích lũy','Gốc cửa sổ = 100 · 126 phiên gần nhất')}${lineChart('stockChart',[{values:curve,color:E.COLORS[a.sector],fill:true}],a.dates.slice(start),{label:'Chỉ số tích lũy của '+a.ticker,height:230})}<div class="equal-col section-gap"><div class="stock-fact"><span>Trạng thái kỹ thuật</span><strong>${a.trend}</strong><p>${a.trend==='Tích cực'?'Chỉ số tích lũy đang trên trung bình 20 phiên.':'Chỉ số tích lũy đang dưới trung bình 20 phiên.'}</p></div><div class="stock-fact"><span>Trong phương án phân bổ</span><strong>${position?pct(position.weight,2):'Chưa chọn'}</strong><p>${position?cashFormat(position.amount,key):'Có thể điều chỉnh tập mã trong phần Phân bổ vốn.'}</p></div></div><p class="source">Đơn vị chỉ số, không phải giá niêm yết. <button class="text-link" data-action="help">Xem nguồn dữ liệu</button></p>`;
 $('stockDialog').showModal();
}
function runPlan(){if(V2.busy)return;if($('planCapital'))S.capital[S.market]=Number($('planCapital').value);stop();V2.error='';V2.busy=true;render();setTimeout(()=>{try{V2.plan=makePlan();V2.search='';V2.sector='all';toast('Đã cập nhật danh sách mã và phân bổ vốn.');}catch(err){V2.error=err.message;}finally{V2.busy=false;render();}},35);}
function filterPlan(){const q=($('planSearch')?.value||'').toLocaleLowerCase('vi-VN'),sector=$('planSector')?.value||'all';let n=0;document.querySelectorAll('[data-plan-row]').forEach(row=>{const visible=row.dataset.search.toLocaleLowerCase('vi-VN').includes(q)&&(sector==='all'||row.dataset.sector===sector);row.hidden=!visible;if(visible)n++;});if($('planRowCount'))$('planRowCount').textContent=n+' / '+getPlan().count+' mã';}
function exportPlan(){const p=getPlan(),rows=[['Mã','Doanh nghiệp','Ngành','Tỷ trọng','Vốn phân bổ',p.key==='VN'?'VND':'USD'],...p.rows.map(r=>[r.ticker,r.name,E.SECTORS[r.sector],r.weight,r.amount,p.key==='VN'?'VND':'USD']),['Tiền mặt','','','',p.cash],['Chi phí','','','',p.fee],['Tổng vốn','','','',p.capital]];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='HybridDQN-phan-bo-'+p.key+'-'+p.date+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function holdings(record,limit=8){const items=record.weights.map((w,id)=>({w,id,a:sim.assets[id]})).filter(o=>o.w>0).sort((a,b)=>b.w-a.w).slice(0,limit);return `<div class="table-wrap"><table><thead><tr><th>Cổ phiếu</th><th>Ngành</th><th>Tỷ trọng</th><th>Vốn mục tiêu</th></tr></thead><tbody>${items.map(({w,id,a})=>`<tr><td class="name"><button class="ticker-link" data-action="stock" data-value="${id}" data-key="${sim.key}" data-date="${record.endDate}">${a[0]}</button><span class="muted" style="display:block;font-size:10px">${a[1]}</span></td><td class="name muted">${E.SECTORS[a[2]]}</td><td>${pct(w,2)}</td><td>${cashFormat(S.capital[S.market]*w)}</td></tr>`).join('')}</tbody></table></div>`;}
function completeHoldings(r){return `<details class="panel advanced section-gap"><summary>Toàn bộ danh mục · ${r.ids.length} cổ phiếu và phân bổ vốn</summary><div class="advanced-body">${holdings(r,Infinity)}<div class="callout">${I('info')}<span>Vốn mục tiêu theo tỷ trọng chiến lược cơ sở. Để điều chỉnh số mã, dự phòng tiền mặt và chi phí, mở <button class="text-link" data-action="go-allocation">Phân bổ vốn</button>.</span></div></div></details>`;}
function fundStrip(d){const r=d.record,full=sim.daily.slice(0,r.end+1),year=r.endDate.slice(0,4),ytd=full.filter(x=>x.date.startsWith(year)).reduce((v,x)=>v*(1+x.ret),1)-1,nav=sim.nav[r.end],status=(value,limit)=>value<limit?'teal':'amber';return `<div class="fund-strip"><div><span>QUY MÔ DANH MỤC</span><b>${cashFormat(S.capital[S.market]*nav/100)}</b></div><div><span>NAV / ĐƠN VỊ</span><b class="mono">${f(nav*100,2)}</b></div><div><span>TỪ ĐẦU NĂM ${year}</span><b class="${ytd>=0?'positive':'negative'}">${pct(ytd,2,true)}</b></div><div><span>ĐỐI CHIẾU</span><b>EW · BH · MomEW</b></div><div><span>QUAN SÁT CUỐI</span><b>${date(r.endDate)}</b></div></div><div class="risk-strip"><span>Giám sát rủi ro</span>${tag('HHI '+f(r.hhi,3),status(r.hhi,.3))}${tag('Drawdown '+pct(d.m.maxDD),status(Math.abs(d.m.maxDD),.2))}${tag('Turnover '+pct(r.turnover),status(r.turnover,.5))}<button class="text-link" data-action="help">Quy ước & ngưỡng theo dõi</button></div>`;}
function annualChart(rows){const years={};rows.forEach(r=>{const y=r.date.slice(0,4);years[y]??={p:1,b:1};years[y].p*=1+r.ret;years[y].b*=1+r.benchRet;});const vals=Object.values(years).flatMap(o=>[o.p-1,o.b-1]),min=Math.min(0,...vals)-.02,max=Math.max(.05,...vals)+.03,W=760,H=190,L=42,T=15,B=25,w=(W-L-12)/Object.keys(years).length,y=v=>T+(max-v)/(max-min)*(H-T-B),zero=y(0);let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lợi nhuận theo năm"><line x1="${L}" x2="${W-12}" y1="${zero}" y2="${zero}" stroke="var(--line)"/>`;Object.entries(years).forEach(([year,o],i)=>{const x=L+w*(i+.5),bw=Math.min(27,w*.23);[o.p-1,o.b-1].forEach((v,j)=>{s+=`<rect x="${x+(j===0?-bw-2:2)}" y="${Math.min(y(v),zero)}" width="${bw}" height="${Math.max(1,Math.abs(y(v)-zero))}" rx="2" fill="${j?'#9aabc3':'#2563eb'}"><title>${year} · ${j?'EW':'Hybrid'}: ${pct(v,2)}</title></rect>`;});s+=`<text x="${x}" y="${H-4}" text-anchor="middle">${year}</text>`;});return `<div class="chart">${s}</svg></div>`;}
function performanceExtras(d){const a=E.attribution(d.rows.map(x=>x.ret),d.rows.map(x=>x.benchRet)),ms=d.record.states[0],signal=ms>1?'Tăng trưởng':ms<0?'Thận trọng':'Cân bằng';return `<div class="equal-col section-gap"><section class="panel panel-pad">${panelTitle('Attribution so với benchmark','Alpha số học · Benchmark EW')}<div class="attribution-grid">${[['Alpha / năm',pct(a.alpha,2,true)],['Beta',f(a.beta,3)],['Information Ratio',f(a.ir,3)],['Tracking Error',pct(a.te,2)]].map(([l,v])=>`<div><span>${l}</span><strong>${v}</strong></div>`).join('')}</div><div class="rule"></div>${panelTitle('Lợi nhuận theo năm','Cùng cửa sổ quan sát')}${annualChart(d.rows)}</section><section class="panel panel-pad">${panelTitle('Tín hiệu phân bổ & nhận định','Theo trạng thái kỳ đang chọn',tag(signal,ms<0?'amber':'teal'))}<div class="insight-row"><h3>${d.record.action.opt} · ${d.record.action.profile}</h3><p>MarketSharpe ${f(ms,2)}, tương quan ${f(d.record.states[2],2)}. Cấu hình ${d.record.action.cov} phân bổ vào ${d.record.ids.length} mã, HHI ${f(d.record.hhi,3)}.</p></div><div class="insight-row"><h3>10 kỳ gần nhất</h3><div class="mini-return-bars">${sim.records.slice(Math.max(0,S.cursor-9),S.cursor+1).map(r=>`<div title="${date(r.date)}: ${pct(r.blockRet,2)}"><span>${r.date.slice(5)}</span><i style="width:${Math.min(70,Math.abs(r.blockRet)*300+2)}%;background:${r.blockRet>=0?'var(--teal)':'var(--red)'}"></i><b class="${r.blockRet>=0?'positive':'negative'}">${pct(r.blockRet,1,true)}</b></div>`).join('')}</div></div><div class="summary-explainer">${Math.abs(d.m.maxDD)>.2?'Sụt giảm vượt ngưỡng theo dõi 20%; cần đọc cùng lịch sử phục hồi và cấu trúc phân bổ.':'Sụt giảm dưới ngưỡng theo dõi 20% trong cửa sổ hiện tại.'} ${d.record.turnover>.5?'Turnover cao làm tăng chi phí tái cân bằng.':'Turnover ở mức thấp hơn ngưỡng theo dõi 50%.'}</div></section></div>`;}
function numericChart(id,values,dates,color,options={}){const first=values.findIndex(Number.isFinite);if(first<0||values.length-first<2)return '<div class="empty-chart">Cần thêm lịch sử để tính chỉ báo.</div>';return lineChart(id,[{values:values.slice(first).map(v=>Number.isFinite(v)?v:0),color}],dates.slice(first),{height:190,...options});}
function histogram(rets){const bins=18,mn=Math.min(...rets),mx=Math.max(...rets),step=(mx-mn||.01)/bins,counts=Array(bins).fill(0);rets.forEach(r=>counts[Math.min(bins-1,Math.floor((r-mn)/step))]++);const W=750,H=190,L=35,B=25,max=Math.max(...counts,1);return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Phân phối lợi nhuận ngày">${counts.map((n,i)=>{const x=L+i*(W-L-10)/bins,h=n/max*(H-B-15),v=mn+(i+.5)*step;return `<rect x="${x}" y="${H-B-h}" width="${(W-L-10)/bins-3}" height="${Math.max(1,h)}" rx="2" fill="${v>=0?'#32aa96':'#d87783'}"><title>${pct(v,2)}: ${n} phiên</title></rect>${i%3===0?`<text x="${x}" y="${H-5}">${pct(v,1)}</text>`:''}`;}).join('')}</svg></div>`;}
function actionMix(){const counts=Array(12).fill(0);sim.records.slice(0,S.cursor+1).forEach(r=>counts[r.action.id]++);const max=Math.max(...counts,1);return `<div class="action-mix">${counts.map((n,i)=>`<div><span>R${i+1} · ${i<6?'PSO':'HRP'} · ${i%6<3?'Sample':'Co rút'}</span><div><i style="width:${n/max*100}%;background:${i<6?'var(--blue)':'var(--teal)'}"></i></div><b>${n}</b></div>`).join('')}</div>`;}
function eventTable(){const events=[['2015-07-01','2015-09-30','Biến động thị trường Trung Quốc'],['2018-10-01','2018-12-31','Căng thẳng thương mại Mỹ–Trung'],['2020-02-24','2020-03-31','Đại dịch COVID-19'],['2022-05-01','2022-11-30','Biến động thị trường năm 2022'],['2025-04-01','2025-04-30','Cú sốc thuế quan 2025']];return `<div class="event-list">${events.map(([start,end,name])=>{const rows=sim.daily.slice(0,selected().end+1).filter(r=>r.date>=start&&r.date<=end),ret=rows.reduce((v,r)=>v*(1+r.ret),1)-1;return `<div><span class="event-dot"></span><div><strong>${name}</strong><span>${start.slice(0,7)} · ${end.slice(0,7)}</span></div><b class="${rows.length?(ret>=0?'positive':'negative'):'muted'}">${rows.length?pct(ret,2,true):'Ngoài cửa sổ'}</b></div>`;}).join('')}</div>`;}
function analytics(){const d=windowData();viewData=d;const r=d.record,full=sim.daily.slice(0,r.end+1),rets=full.map(x=>x.ret),dates=d.rows.map(x=>x.date),prices=sim.nav.slice(0,r.end+1),ind=E.indicators(prices),rsi=ind.rsi.slice(d.start),macd=ind.macd.slice(d.start),sig=ind.signal.slice(d.start),vol=E.rolling(rets,21,a=>E.sd(a)*Math.sqrt(252)).slice(d.start),sharpe=E.rolling(rets,63,a=>E.mean(a)/(E.sd(a)||1e-9)*Math.sqrt(252)).slice(d.start);
 return `${head('PHÂN TÍCH ĐA CHIỀU','Phân tích thị trường','Động lượng, phân phối rủi ro và tâm lý định lượng trong cùng một không gian.',button('Phương pháp chỉ báo','help','info'))}${controls()}<div class="analytics-tabs">${[['technical','Phân tích kỹ thuật'],['sentiment','Tâm lý thị trường']].map(([k,l])=>`<button class="${V2.tab===k?'active':''}" data-action="analysis-tab" data-value="${k}">${l}</button>`).join('')}<span>Quan sát đến ${date(r.endDate)}</span></div>${V2.tab==='sentiment'?sentimentView(d):`<div class="equal-col"><section class="panel panel-pad">${panelTitle('Rolling Volatility · 21 phiên','Biến động thường niên hóa')}${numericChart('rollingVol',vol,dates,'#c99b45',{percent:true})}</section><section class="panel panel-pad">${panelTitle('Rolling Sharpe · 63 phiên','Trung bình số học / độ lệch chuẩn × √252')}${numericChart('rollingSharpe',sharpe,dates,'#3580d6',{decimals:1})}</section><section class="panel panel-pad">${panelTitle('RSI (14)','Tính trên chỉ số NAV · Ngưỡng 30 / 70')}${numericChart('rsiFund',rsi,dates,'#14a493',{min:0,max:100,pad:false})}</section><section class="panel panel-pad">${panelTitle('MACD (12, 26, 9)','Đường MACD và đường tín hiệu')}${macd.some(Number.isFinite)?lineChart('macdFund',[{values:macd.filter(Number.isFinite),color:'#2563eb'},{values:sig.filter(Number.isFinite),color:'#cf9953',dash:true}],dates.slice(macd.findIndex(Number.isFinite)),{height:190,decimals:2}):'<div class="empty-chart">Cần thêm lịch sử để tính MACD.</div>'}</section><section class="panel panel-pad">${panelTitle('Phân phối lợi nhuận ngày','Tần suất quan sát theo khoảng lợi nhuận')}${histogram(d.rows.map(x=>x.ret))}</section><section class="panel panel-pad">${panelTitle('Lựa chọn chế độ','Tần suất 12 nhãn hành động')}${actionMix()}</section></div><div class="equal-col section-gap"><section class="panel panel-pad">${panelTitle('Bảng nhiệt lợi nhuận tháng','Lãi kép theo ngày · Đơn vị %')}${heatmap(d.rows)}</section><section class="panel panel-pad">${panelTitle('Cửa sổ sự kiện thị trường','Biến động NAV trong các cửa sổ quan sát')}${eventTable()}</section></div><section class="panel panel-pad section-gap">${panelTitle('Bảng chỉ số đầy đủ','Cùng tần suất dữ liệu ngày')}${riskTable(d)}<div class="metric-summary-line">${[['Tổng lợi nhuận',pct(d.m.total,2,true)],['Omega',f(d.m.omega,3)],['Tỷ lệ phiên tăng',pct(d.m.win)],['Information Ratio',f(E.attribution(d.rows.map(x=>x.ret),d.rows.map(x=>x.benchRet)).ir,3)]].map(([l,v])=>`<span>${l}<b>${v}</b></span>`).join('')}</div></section>`}${foot()}`;

function help(){
 $('helpBody').innerHTML=V2.lang==='en'?`<h3>Data and scope</h3><p>Published results are transcribed from Tables 4.1, 4.2, 4.4 and 4.5 in the supplied research paper. They remain independent of portfolio inputs.</p><p>Interactive portfolio, allocation, stock charts and technical indicators use synthetic research data, not historical prices or a live market feed. The regime selector is rule-based and does not execute the paper’s trained D3QN checkpoint. PSO/HRP allocators use reduced configurations; the shrinkage branch uses a fixed coefficient.</p><h3>Capital allocation</h3><p>Stock budgets, cash and estimated fees reconcile exactly to the entered capital. No market prices, order quantities, fills, news counts or real model confidence scores are fabricated. Allocation output describes a research scenario, not a live trading recommendation.</p><h3>Metrics and constraints</h3><p>Daily returns are annualized using 252 sessions. NAV is rebased to 100 for the selected window. SRPerf uses geometric annual return; bootstrap intervals concern SRBoot based on arithmetic daily returns. An interval above zero is not a pairwise superiority test.</p><p>Turnover uses the full target-weight union without a half factor. Transaction costs are 0.001 × turnover, deducted at the start of each block. Interactive benchmarks exclude explicit costs. Stock indicators use cumulative indices rather than quoted prices. The internal sentiment score covers four available components; news and actual fund flows remain unconnected.</p>`:`<h3>Nguồn dữ liệu và phạm vi sử dụng</h3><p><strong>Kết quả công bố</strong> được trích từ Bảng 4.1, 4.2, 4.4 và 4.5 trong bản toàn văn. Các số này độc lập với số tiền và cấu hình người xem nhập. Giai đoạn lấy dữ liệu của nghiên cứu: 01/01/2010–24/03/2026; không đồng nhất với mọi cửa sổ OOS.</p><p><strong>Các màn hình tương tác sử dụng dữ liệu tổng hợp theo kịch bản nghiên cứu</strong>, không kết nối giá lịch sử hay bảng giá trực tiếp. Bộ chọn chế độ dùng quy tắc xác định, không chạy checkpoint D3QN đã huấn luyện trong bài. PSO/HRP dùng cấu hình rút gọn; nhánh co rút dùng hệ số cố định 35%.</p><h3>Phân bổ vốn và danh sách mã</h3><p>D3QN trong kiến trúc nghiên cứu chọn chế độ, không trực tiếp khuyến nghị từng mã. Tập mã được xếp hạng theo động lượng và chuyển cho bộ phân bổ. Trang Phân bổ vốn dùng trọng số và giới hạn người xem chọn để tính ngân sách cho từng cổ phiếu; không cung cấp giá đặt lệnh, số cổ phiếu khớp lệnh hay khẳng định đây là khuyến nghị giao dịch thực tế.</p><p>Ngân sách cổ phiếu + tiền mặt + chi phí bằng vốn nhập. Phí 0,10% được dự phòng trước khi phân bổ; số tiền theo mã được làm tròn theo đơn vị tiền tệ bằng quy tắc phần dư lớn nhất. Khi thay đổi thiết lập, phải bấm Phân tích & phân bổ để áp dụng.</p><h3>Danh mục và chỉ báo</h3><p>Chuỗi tổng hợp theo ngày trong tuần từ 02/01/2020 đến 24/03/2026, chưa loại trừ ngày lễ. Trọng số mục tiêu giữ cố định trong từng khối. Turnover tính trên toàn bộ tập trọng số trước/sau, không chia 2; phí 0,001 × turnover trừ vào ngày đầu khối. Quy ước này khác TO trên tập tài sản hoạt động trong nghiên cứu. Benchmark tương tác chưa khấu trừ phí.</p><p>Biểu đồ từng mã dùng chỉ số tích lũy gốc 100, không phải giá niêm yết. RSI và MACD tính từ chỉ số tích lũy; các chỉ báo không phải nguồn tin doanh nghiệp. Chỉ số tâm lý nội bộ dùng động lượng, RSI, độ rộng và biến động. Nguồn tin tức và dòng tiền giao dịch chưa kết nối, vì vậy các ô liên quan để trống thay vì tạo số bài báo.</p><div class="formula">NAVₜ = NAVₜ₋₁ × (1 + rₜ)<br>AR = (NAV cuối / NAV đầu)^(252/N) − 1<br>σ năm = sd(r ngày) × √252<br>SRPerf = AR / σ năm<br>Calmar = AR / |Max drawdown|</div><h3>Đối chiếu và suy luận</h3><p>SRBoot dùng trung bình số học của lợi nhuận ngày, khác SRPerf. KTC 95% từ bootstrap i.i.d. 1.000 lần không phải dải sai số quanh SRPerf và không thay thế kiểm định theo cặp. Hai thị trường có khác biệt đặc tả phần thưởng và dữ liệu; so sánh có tính mô tả, không quy toàn bộ chênh lệch cho cấu trúc thị trường.</p><p>Dữ liệu nghiên cứu còn hạn chế về thiên lệch sống sót, xử lý thiếu dữ liệu, điều chỉnh giá, chi phí và tần suất lưu NAV. MinVar Việt Nam là chẩn đoán hậu nghiệm; cơ chế dự phòng Hoa Kỳ không kích hoạt trong OOS đã lưu. Nguồn: Chương 3, Bảng 4.3, 4.6 và mục 5.3.</p><h3>Thao tác</h3><p>Nhập vốn, cấu hình tập mã rồi bấm Phân tích & phân bổ. Chạm mã để xem chi tiết. Tại Danh mục & hiệu quả, phát lại theo kỳ, Ctrl + cuộn để thu/phóng, kéo ngang để di chuyển cửa sổ; nhấp đúp để về toàn kỳ. Nút trình chiếu ở góc trên; Esc thoát. Có thể xuất CSV và chuyển VI/EN.</p>`;
 $('helpDialog').showModal();
}

document.addEventListener('input',e=>{if(e.target.dataset.field==='pCapital'){S.capital[S.market]=Number(e.target.value);const status=document.querySelector('.plan-result-top .tag');if(status){status.textContent='Tham số chưa áp dụng';status.className='tag amber';}}if(e.target.id==='planSearch')filterPlan();if(e.target.dataset.field==='pReserve'){e.target.nextElementSibling.textContent=e.target.value+'%';}});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.field;if(t.id==='planSector'){filterPlan();return;}if(!k?.startsWith('p'))return;V2.error='';if(k==='pCapital'){S.capital[S.market]=Number(t.value);return;}if(k==='pMode'){S.mode=t.value;S.cursor=-1;}if(k==='pCount')V2.count=Number(t.value);if(k==='pCap')V2.cap=Number(t.value);if(k==='pReserve')V2.reserve=Number(t.value);render();});
document.addEventListener('pointerdown',e=>{const c=e.target.closest('[data-chart="nav"]');S.chartDragged=false;if(c&&viewData&&e.button===0)V2.drag={x:e.clientX,cursor:S.cursor,days:viewData.rows.length,width:c.getBoundingClientRect().width};});
document.addEventListener('pointerup',e=>{const a=V2.drag;V2.drag=null;if(!a||Math.abs(e.clientX-a.x)<8||S.window===0)return;const delta=Math.round((e.clientX-a.x)/a.width*a.days/S.horizon);stop();S.cursor=Math.max(0,Math.min(sim.records.length-1,a.cursor-delta));S.chartDragged=true;render();});
document.addEventListener('wheel',e=>{if(!e.ctrlKey||!e.target.closest('[data-chart="nav"]')||!viewData)return;e.preventDefault();S.window=Math.max(20,Math.min(viewData.end+1,Math.round(viewData.rows.length*(e.deltaY>0?1.3:.75))));render();},{passive:false});
document.addEventListener('dblclick',e=>{if(e.target.closest('[data-chart="nav"]')){S.window=0;render();}});

function applyLanguage(){
 $('langBtn').textContent=V2.lang==='vi'?'EN':'VI';$('langBtn').title=V2.lang==='vi'?'English interface':'Giao diện tiếng Việt';
 if(V2.lang!=='en')return;
 const pairs=Object.entries(EN).sort((a,b)=>b[0].length-a[0].length);
 const translate=s=>{let out=s;for(const [k,val] of pairs)out=out.split(k).join(val);return out;};
 for(const parent of [$('app'),$('sidebarNav'),$('presentNav'),document.querySelector('.topbar'),document.querySelector('.nav-bottom')]){if(!parent)continue;const walker=document.createTreeWalker(parent,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(node=>node.nodeValue=translate(node.nodeValue));parent.querySelectorAll('[title],[placeholder],[aria-label]').forEach(el=>['title','placeholder','aria-label'].forEach(a=>{if(el.hasAttribute(a))el.setAttribute(a,translate(el.getAttribute(a)));}));}
}

function stop(){S.playing=false;clearInterval(timer);timer=null;}
function render(){
 const wasAdvanced=$('advancedPanel')?.open||false;const excludeOpen=document.querySelector('.exclude-picker')?.open||false;
 $('crumb').textContent=routes.find(r=>r[0]===S.view)[1];
 $('sidebarNav').innerHTML=routes.map(([key,label,icon],i)=>`<a class="nav-link ${S.view===key?'active':''}" href="#${key}" aria-label="${label}" title="${label}" ${S.view===key?'aria-current="page"':''}>${I(icon)}<span class="nav-text">${label}</span><span class="nav-num">0${i+1}</span></a>`).join('');
 $('presentNav').innerHTML=routes.map(([key,label])=>`<button data-action="go-${key}" class="${S.view===key?'active':''}">${label}</button>`).join('');
 $('themeBtn').innerHTML=I(document.documentElement.dataset.theme==='dark'?'sun':'moon');$('presentBtn').innerHTML=I('expand');$('infoBtn').innerHTML=I('info');$('helpIcon').innerHTML=I('book');$('presentBtn').setAttribute('aria-pressed',String(S.presentation));
 $('app').innerHTML=`<div class="page-view">${({overview,allocation:allocationPage,simulation,analytics,decisions,compare,results}[S.view])()}</div>`;
 if(wasAdvanced&&$('advancedPanel'))$('advancedPanel').open=true;
 if(excludeOpen&&document.querySelector('.exclude-picker'))document.querySelector('.exclude-picker').open=true;
 applyLanguage();
}
function go(view){if(!routes.some(r=>r[0]===view))return;stop();if(location.hash==='#'+view){S.view=view;render();window.scrollTo({top:0,behavior:'instant'});}else location.hash=view;}
function resetData(){stop();S.cursor=-1;render();}
function act(action,value,el){
 if(v2Act(action,value,el))return;
 if(action.startsWith('go-')){go(action.slice(3));return;}
 switch(action){
 case 'market':if(S.market!==value){S.market=value;resetData();}break;
 case 'horizon':if(S.horizon!==Number(value)){S.horizon=Number(value);resetData();}break;
 case 'window':S.window=Number(value);render();break;
 case 'metric':S.metric=value;render();break;
 case 'benchmark':S.bench[value]=!S.bench[value];render();break;
 case 'record':stop();S.cursor=Number(value);render();break;
 case 'reset':stop();S.cursor=0;render();break;
 case 'step':stop();getSim();S.cursor=Math.min(sim.records.length-1,S.cursor+1);render();break;
 case 'play':
  if(S.playing){stop();render();break;}
  getSim();if(S.cursor>=sim.records.length-1)S.cursor=0;S.playing=true;render();
  timer=setInterval(()=>{if(S.cursor>=sim.records.length-1){stop();render();return;}S.cursor++;render();},850);break;
 case 'theme':{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';try{localStorage.setItem('hybrid-dqn-theme',dark?'light':'dark');}catch{}render();break;}
 case 'presentation':S.presentation=!S.presentation;document.body.classList.toggle('presentation',S.presentation);render();if(S.presentation)toast('Chế độ trình chiếu · Dùng các nút trên cùng để đổi màn hình · Esc để thoát');break;
 case 'help':help();break;
 case 'close-help':$('helpDialog').close();break;
 }
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(el){act(el.dataset.action,el.dataset.value,el);return;}
 const chart=e.target.closest('[data-chart="nav"]');if(chart&&viewData){if(S.chartDragged){S.chartDragged=false;return;}const p=chartPoint(e,chart),r=sim.daily[p.index]?.record;if(r!==undefined){stop();S.cursor=r;render();}}
});
document.addEventListener('change',e=>{const el=e.target,field=el.dataset.field;if(field==='mode'){S.mode=el.value;resetData();}if(field==='capital'){const v=Number(el.value);if(Number.isFinite(v)&&v>=1&&v<=1e15){S.capital[S.market]=v;render();}else{el.value=S.capital[S.market];toast('Vui lòng nhập vốn từ 1 đến 1.000.000.000.000.000.');}}if(field==='cursor'){stop();S.cursor=Number(el.value);render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.presentation){S.presentation=false;document.body.classList.remove('presentation');render();}if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-action]')){e.preventDefault();act(e.target.dataset.action,e.target.dataset.value,e.target);}});
function chartPoint(e,chart){const rect=chart.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*800,ratio=Math.max(0,Math.min(1,(x-43)/(800-43-14))),index=viewData.start+Math.round(ratio*(viewData.rows.length-1));return{index,x:e.clientX-rect.left,y:e.clientY-rect.top};}
document.addEventListener('pointermove',e=>{const chart=e.target.closest('[data-chart="nav"]'),tip=$('navTooltip');if(!chart||!tip||!viewData){if(tip)tip.style.display='none';return;}const p=chartPoint(e,chart),j=p.index-viewData.start,row=viewData.rows[j];if(!row)return;tip.innerHTML=`${date(row.date)}<br><strong>Hybrid ${f(viewData.m.curve[j],2)}</strong><br>EW ${f(viewData.bm.curve[j],2)}`;tip.style.display='block';tip.style.left=Math.max(85,Math.min(chart.clientWidth-85,p.x))+'px';tip.style.top=Math.max(80,p.y-12)+'px';});
window.addEventListener('hashchange',()=>{const view=location.hash.slice(1);S.view=routes.some(r=>r[0]===view)?view:'overview';stop();render();window.scrollTo({top:0,behavior:'instant'});});
$('helpDialog').addEventListener('click',e=>{if(e.target===$('helpDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
try{if(localStorage.getItem('hybrid-dqn-theme')==='dark')document.documentElement.dataset.theme='dark';}catch{}
const initial=location.hash.slice(1);if(routes.some(r=>r[0]===initial))S.view=initial;
render();
})();

</script>
